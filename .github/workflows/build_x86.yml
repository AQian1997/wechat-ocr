name: Build x86 DLL (CMake)

on: [push]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive  # 确保子模块也被下载，防止缺文件
    
    # 新增步骤：强制安装 32位 Python，解决 CMake 报错
    - name: Set up Python x86
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        architecture: 'x86' 
    
    - name: Configure CMake (x86)
      # 强制指定 Win32 架构
      run: cmake -S . -B build -A Win32
      
    - name: Build
      # 进行 Release 编译
      run: cmake --build build --config Release
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wcocr_x86_dll
        # 编译完成后，文件通常在 build/Release 目录下
        path: build/Release/wcocr.dll
